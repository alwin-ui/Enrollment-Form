<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enroll a New Student</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0d1117;
    }
    
    /* Custom styled switch toggle */
    .toggle-checkbox:checked {
      right: 0;
      background-color: #000000;
    }
    .toggle-checkbox:checked + .toggle-label {
      background-color: #000000;
    }

    /* Subtle backdrop blur effect */
    .backdrop-blur-custom {
      backdrop-filter: blur(8px);
      background-color: rgba(15, 23, 42, 0.65);
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-6 md:p-10 relative overflow-x-hidden">

  <!-- Background decorative elements -->
  <div class="fixed inset-0 pointer-events-none z-0 opacity-40">
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-slate-700 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-zinc-800 rounded-full blur-3xl"></div>
  </div>

  <!-- Main Modal Container -->
  <div class="relative z-10 w-full max-w-2xl bg-white rounded-2xl shadow-2xl overflow-hidden border border-gray-100 my-auto">
    
    <!-- Modal Header -->
    <div class="p-6 sm:p-8 pb-4 relative border-b border-gray-50">
      <div class="flex items-start justify-between">
        <div>
          <h1 class="text-2xl sm:text-3xl font-bold text-gray-900 tracking-tight">Enroll a new student</h1>
          <p class="text-sm text-gray-500 mt-1">They'll be able to create a Student Portal password using the email you enter.</p>
        </div>
        <button id="close-modal-btn" type="button" class="text-gray-400 hover:text-gray-600 transition-colors p-1 rounded-full hover:bg-gray-100">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
    </div>

    <!-- Form Section -->
    <form id="enrollment-form" action="https://formspree.io/f/xbgdoygb" method="POST" class="p-6 sm:p-8 pt-6 space-y-6">
      
      <div class="space-y-4">
        <h2 class="text-base font-semibold text-gray-900">Student details</h2>

        <!-- Full Name -->
        <div>
          <label for="fullName" class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">
            Full name <span class="text-red-500">*</span>
