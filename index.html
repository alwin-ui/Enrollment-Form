<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music School Student Enrollment</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen py-10 px-4 flex items-center justify-center">

  <div class="max-w-xl w-full bg-white rounded-2xl shadow-xl p-6 sm:p-8 border border-gray-100">
    <div class="mb-6 border-b border-gray-100 pb-4">
      <h1 class="text-2xl font-bold text-gray-900">Enroll a New Student</h1>
      <p class="text-sm text-gray-500 mt-1">Please fill in the student details below to complete registration.</p>
    </div>

    <form action="https://formspree.io/f/xbgdoygb" method="POST" class="space-y-5">
      
      <!-- Student Full Name -->
      <div>
        <label for="fullName" class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">
          Full Name <span class="text-red-500">*</span>
        </label>
        <input 
          type="text" 
          id="fullName" 
          name="fullName" 
          required 
          placeholder="e.g. Juan Dela Cruz" 
          class="w-full px-4 py-2.5 text-sm rounded-lg border border-gray-300 focus:ring-2 focus:ring-black focus:outline-none"
        />
      </div>

      <!-- Email & Phone Grid -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label for="email" class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">Email</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            placeholder="juan@example.com" 
            class="w-full px-4 py-2.5 text-sm rounded-lg border border-gray-300 focus:ring-2 focus:ring-black focus:outline-none"
          />
        </div>

        <div>
          <label for="phone" class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">Phone Number</label>
          <input 
            type="tel" 
            id="phone" 
            name="phone" 
            placeholder="0917 000 0000" 
            class="w-full px-4 py-2.5 text-sm rounded-lg border border-gray-300 focus:ring-2 focus:ring-black focus:outline-none"
          />
        </div>
      </div>

      <!-- Gender & Birthday -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label for="gender" class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">Gender</label>
          <select id="gender" name="gender" class="w-full px-4 py-2.5 text-sm rounded-lg border border-gray-300 bg-white focus:ring-2 focus:ring-black focus:outline-none">
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Prefer not to say">Prefer not to say</option>
          </select>
        </div>

        <div>
          <label for="birthday" class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">Birthday</label>
          <input 
            type="date" 
            id="birthday" 
            name="birthday" 
            class="w-full px-4 py-2.5 text-sm rounded-lg border border-gray-300 focus:ring-2 focus:ring-black focus:outline-none"
          />
        </div>
      </div>

      <!-- Instrument Selection -->
      <div>
        <label for="instrument" class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">
          Select Instrument / Course <span class="text-red-500">*</span>
        </label>
        <select id="instrument" name="instrument" required class="w-full px-4 py-2.5 text-sm rounded-lg border border-gray-300 bg-white focus:ring-2 focus:ring-black focus:outline-none">
          <option value="">-- Choose an instrument --</option>
          <option value="Piano">Piano</option>
          <option value="Guitar">Guitar</option>
          <option value="Violin">Violin</option>
          <option value="Drums">Drums</option>
          <option value="Voice Lessons">Voice Lessons</option>
          <option value="Flute">Flute</option>
          <option value="Saxophone">Saxophone</option>
        </select>
      </div>

      <!-- Parent Information Header -->
      <div class="pt-4 border-t border-gray-100">
        <h2 class="text-sm font-bold text-gray-900 mb-3">Parent / Guardian Details (Optional)</h2>
        <div class="space-y-4">
          <div>
            <label for="parentName" class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">Parent Name</label>
            <input 
              type="text" 
              id="parentName" 
              name="parentName" 
              placeholder="Parent or Guardian Name" 
              class="w-full px-4 py-2.5 text-sm rounded-lg border border-gray-300 focus:ring-2 focus:ring-black focus:outline-none"
            />
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label for="parentPhone" class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">Parent Phone</label>
              <input 
                type="tel" 
                id="parentPhone" 
                name="parentPhone" 
                placeholder="Parent Phone Number" 
                class="w-full px-4 py-2.5 text-sm rounded-lg border border-gray-300 focus:ring-2 focus:ring-black focus:outline-none"
              />
            </div>
            <div>
              <label for="parentEmail" class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">Parent Email</label>
              <input 
                type="email" 
                id="parentEmail" 
                name="parentEmail" 
                placeholder="Parent Email Address" 
                class="w-full px-4 py-2.5 text-sm rounded-lg border border-gray-300 focus:ring-2 focus:ring-black focus:outline-none"
              />
            </div>
          </div>
        </div>
      </div>

      <!-- Submit Button -->
      <div class="pt-4">
        <button 
          type="submit" 
          class="w-full py-3 bg-black text-white font-semibold text-sm rounded-lg hover:bg-gray-800 transition-colors shadow-md"
        >
          Submit Enrollment
        </button>
      </div>

    </form>
  </div>

</body>
</html>
